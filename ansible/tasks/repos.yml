# --- tailscale ---------------------------------------------------------------

- name: Add the Tailscale signing key
  become: true
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_facts.distribution_release }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    owner: root
    group: root
    mode: "0644"
  tags: [tailscale]

- name: Add the Tailscale apt source
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/tailscale.list
    content: >
      deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg]
      https://pkgs.tailscale.com/stable/ubuntu {{ ansible_facts.distribution_release }} main
    owner: root
    group: root
    mode: "0644"
  tags: [tailscale]

# --- vscode ------------------------------------------------------------------

- name: Add the Microsoft signing key
  become: true
  ansible.builtin.shell:
    cmd: >-
      curl -fsSL https://packages.microsoft.com/keys/microsoft.asc
      | gpg --dearmor -o /usr/share/keyrings/microsoft.gpg
    creates: /usr/share/keyrings/microsoft.gpg
  tags: [vscode]

- name: Add the VS Code apt source
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/vscode.sources
    content: |
      Types: deb
      URIs: https://packages.microsoft.com/repos/code
      Suites: stable
      Components: main
      Architectures: amd64,arm64,armhf
      Signed-By: /usr/share/keyrings/microsoft.gpg
    owner: root
    group: root
    mode: "0644"
  tags: [vscode]

# --- launchpad ppas ----------------------------------------------------------
# Each is a keyserver fingerprint plus a deb822 source named after the ppa.

- name: Add the Launchpad PPA signing keys
  become: true
  ansible.builtin.shell:
    cmd: >-
      curl -fsSL 'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x{{ item.fingerprint }}'
      | gpg --dearmor -o /etc/apt/keyrings/{{ item.keyring }}.gpg
    creates: "/etc/apt/keyrings/{{ item.keyring }}.gpg"
  loop:
    - keyring: cappelikan-ppa
      fingerprint: 3AE27527713D2479DCAFFD58A89D7C1B2F76304D
    - keyring: git-core-ppa
      fingerprint: F911AB184317630C59970973E363C90F8F1B6217
    - keyring: neovim-ppa
      fingerprint: 9DBB0BE9366964F134855E2255F96FCF8231B6DD
  loop_control:
    label: "{{ item.keyring }}"
  tags: [ppas]

- name: Add the Launchpad PPA apt sources
  become: true
  ansible.builtin.copy:
    dest: "/etc/apt/sources.list.d/{{ item.file }}-{{ ansible_facts.distribution_release }}.sources"
    content: |
      Types: deb
      URIs: {{ item.uri }}
      Suites: {{ ansible_facts.distribution_release }}
      Components: main
      Signed-By: /etc/apt/keyrings/{{ item.keyring }}.gpg
    owner: root
    group: root
    mode: "0644"
  loop:
    - file: cappelikan-ubuntu-ppa
      keyring: cappelikan-ppa
      uri: https://ppa.launchpadcontent.net/cappelikan/ppa/ubuntu/
    - file: git-core-ubuntu-ppa
      keyring: git-core-ppa
      uri: https://ppa.launchpadcontent.net/git-core/ppa/ubuntu/
    - file: neovim-ppa-ubuntu-unstable
      keyring: neovim-ppa
      uri: https://ppa.launchpadcontent.net/neovim-ppa/unstable/ubuntu/
  loop_control:
    label: "{{ item.file }}"
  tags: [ppas]
