# Apt signing keys and sources. Keys that upstream publishes armoured are
# dearmoured on the way in, which is why those tasks shell out; `creates`
# keeps them from re-running. Source files are written verbatim so they can be
# diffed against the Salt states they came from.

- name: Ensure keyring directories exist
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/apt/keyrings
    - /usr/share/keyrings
  tags: [keyrings]

# --- chrome ------------------------------------------------------------------

- name: Add the Google Chrome signing key
  become: true
  ansible.builtin.shell:
    cmd: >-
      curl -fSsL https://dl.google.com/linux/linux_signing_key.pub
      | gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
    creates: /usr/share/keyrings/google-chrome.gpg
  tags: [chrome]

- name: Add the Google Chrome apt source
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/google-chrome.list
    content: >
      deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg]
      http://dl.google.com/linux/chrome/deb/ stable main
    owner: root
    group: root
    mode: "0644"
  tags: [chrome]

# --- docker ------------------------------------------------------------------

- name: Add the Docker signing key
  become: true
  ansible.builtin.shell:
    cmd: >-
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg
      | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
    creates: /etc/apt/keyrings/docker.gpg
  tags: [docker]

- name: Add the Docker apt source
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    content: >
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg]
      https://download.docker.com/linux/ubuntu {{ ansible_facts.distribution_release }} stable
    owner: root
    group: root
    mode: "0644"
  tags: [docker]

