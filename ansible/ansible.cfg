[defaults]
inventory = inventory.ini
roles_path = roles
result_format = yaml
display_skipped_hosts = False
interpreter_python = auto_silent

[privilege_escalation]
# Ubuntu points /usr/bin/sudo at sudo-rs, which wraps the prompt sudo -p asks
# for: it prints "[sudo: <prompt>] Password:" where ansible waits for a line
# starting with "<prompt>". Detection never matches and become times out
# without ever sending the password. ansible-core 2.20.1 predates the fix for
# this (ansible/ansible#86175), so point become at the classic sudo that
# Ubuntu still ships alongside.
become_exe = /usr/bin/sudo.ws
